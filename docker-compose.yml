services:

  backend:
    build:
      context: ./backend

    container_name: autocomplete-backend

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    command: npm run dev


  frontend:
    build:
      context: ./frontend

    container_name: autocomplete-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0