name: CI

on:
  push:
    branches:
      - main
      - main/ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  backend:

    name: Backend

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # Baixa o código da branch
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Instala todas as dependências exatamente como estão no package-lock.json
      - name: Install dependencies
        run: npm ci

      # Executa os testes automatizados
      # - name: Run tests
      #  run: npm test

